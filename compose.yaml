services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: valora-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: valora-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped